<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Локатор — интерактивная карта интересных мест рядом">
    <title>Локатор — Карта</title>
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/style.min.css">
</head>
<body>

<header class="app-header">
    <div class="header__inner">
        <a href="index.html" class="header__logo">📍 Локатор</a>
        <nav class="header__nav" aria-label="Основная навигация">
            <a href="index.html" class="header__link header__link--active">Карта</a>
            <a href="profile.html" class="header__link">Профиль</a>
        </nav>
        <a href="profile.html" class="header__avatar" aria-label="Профиль">А</a>
    </div>
</header>

<main class="app-main">

    <section class="search-bar" aria-label="Поиск мест">
        <div class="search-bar__inner">
            <span class="search-bar__icon" aria-hidden="true">🔍</span>
            <input type="search" class="search-bar__input" placeholder="Поиск места..." aria-label="Поиск места">
            <button class="search-bar__filter" aria-label="Фильтры">⚙️</button>
        </div>
    </section>

    <nav class="categories" aria-label="Категории мест">
        <ul class="categories__list">
            <li><button class="category category--active" data-category="all">🍕 Все</button></li>
            <li><button class="category" data-category="coffee">☕ Кофе</button></li>
            <li><button class="category" data-category="parks">🌳 Парки</button></li>
            <li><button class="category" data-category="food">🍔 Еда</button></li>
            <li><button class="category" data-category="shops">🏪 Магазины</button></li>
        </ul>
    </nav>

    <section class="map" aria-label="Интерактивная карта">
        <div class="map__canvas">
            <div class="map__grid"></div>
            <div class="map__road map__road--h" style="top: 30%;"></div>
            <div class="map__road map__road--h" style="top: 65%;"></div>
            <div class="map__road map__road--v" style="left: 25%;"></div>
            <div class="map__road map__road--v" style="left: 60%;"></div>
            <div class="map__park" style="top: 35%; left: 28%; width: 28%; height: 25%;"></div>
            <div class="map__water" style="top: 10%; left: 5%; width: 18%; height: 15%;"></div>

            <button class="map__marker" style="top: 22%; left: 65%;" aria-label="Кофейня Утро"></button>
            <button class="map__marker map__marker--blue" style="top: 42%; left: 30%;" aria-label="Парк Горького"></button>
            <button class="map__marker map__marker--green" style="top: 55%; left: 72%;" aria-label="Бургерная Мясо"></button>
            <button class="map__marker map__marker--orange" style="top: 38%; left: 50%;" aria-label="Пиццерия Рим"></button>

            <div class="map__user" style="top: 50%; left: 45%;" aria-label="Ваше местоположение"></div>
            <button class="map__locate" aria-label="Моё местоположение">📍</button>
        </div>
    </section>

    <section class="places" aria-label="Места рядом">
        <div class="places__handle"></div>
        <h2 class="places__title">Рядом с вами</h2>
        <ul class="places__list">
            <li class="place">
                <a href="detail.html" class="place__link">
                    <div class="place__img">☕</div>
                    <div class="place__info">
                        <h3 class="place__name">Кофейня «Утро»</h3>
                        <p class="place__meta">ул. Ленина, 15 · 350 м</p>
                        <p class="place__rating">★ 4.8 · 120 отзывов</p>
                    </div>
                </a>
            </li>
            <li class="place">
                <a href="detail.html" class="place__link">
                    <div class="place__img">🌳</div>
                    <div class="place__info">
                        <h3 class="place__name">Парк Горького</h3>
                        <p class="place__meta">наб. Реки, 2 · 600 м</p>
                        <p class="place__rating">★ 4.9 · 340 отзывов</p>
                    </div>
                </a>
            </li>
        </ul>
    </section>

</main>

<footer class="app-footer">
    <p class="app-footer__text">© 2025 Локатор. Все права защищены.</p>
</footer>

<script src="js/main.min.js"></script>
</body>
</html>
