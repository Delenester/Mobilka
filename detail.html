<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Детальная информация о месте">
    <title>Локатор — О месте</title>
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/style.min.css">
</head>
<body>

<header class="app-header">
    <div class="header__inner">
        <a href="index.html" class="header__back" aria-label="Назад">←</a>
        <h1 class="header__title">О месте</h1>
        <button class="header__fav" aria-label="В избранное">♡</button>
    </div>
</header>

<main class="app-main">

    <section class="detail-hero" aria-label="Фото места">
        <div class="detail-hero__img">☕</div>
    </section>

    <section class="detail" aria-label="Информация о месте">
        <h2 class="detail__name">Кофейня «Утро»</h2>
        <p class="detail__rating">★ 4.8 · 120 отзывов</p>
        <p class="detail__addr">📍 ул. Ленина, 15 · 350 м от вас</p>

        <ul class="detail__info">
            <li class="detail__row">
                <span class="detail__label">Часы работы</span>
                <span class="detail__value">08:00 – 22:00</span>
            </li>
            <li class="detail__row">
                <span class="detail__label">Средний чек</span>
                <span class="detail__value">350 ₽</span>
            </li>
            <li class="detail__row">
                <span class="detail__label">Кухня</span>
                <span class="detail__value">Кофе, десерты</span>
            </li>
            <li class="detail__row">
                <span class="detail__label">Wi-Fi</span>
                <span class="detail__value">Есть</span>
            </li>
            <li class="detail__row">
                <span class="detail__label">Оплата картой</span>
                <span class="detail__value">Да</span>
            </li>
        </ul>

        <div class="detail__actions">
            <button class="btn btn--primary">🗺 Построить маршрут</button>
            <button class="btn btn--outline" aria-label="В избранное">♡</button>
        </div>
    </section>

</main>

<footer class="app-footer">
    <p class="app-footer__text">© 2025 Локатор. Все права защищены.</p>
</footer>

<script src="js/main.min.js"></script>
</body>
</html>
